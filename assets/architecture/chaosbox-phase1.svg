<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ChaosBox Phase 1 current architecture</title>
  <desc id="desc">A load generator reaches Nginx Ingress through a Minikube tunnel. Nginx routes API, Grafana, and Prometheus paths. The store uses PostgreSQL, while Prometheus, Grafana, Alloy, and Loki provide observability.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8c7dc"/>
    </marker>
    <style>
      .title { font: 700 34px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #f8fafc; }
      .subtitle { font: 18px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #a8b3c7; }
      .label { font: 700 17px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #f8fafc; }
      .body { font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #dbe5f3; }
      .panel { fill: #131a24; stroke-width: 3; stroke-dasharray: 12 10; rx: 28; }
      .box { fill: #111820; stroke-width: 3; rx: 22; }
      .flow { fill: none; stroke: #b8c7dc; stroke-width: 3; marker-end: url(#arrow); }
      .signal { fill: none; stroke: #4ade80; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#101214"/>
  <text x="45" y="58" class="title">ChaosBox Phase 1 · Current Architecture</text>
  <text x="45" y="94" class="subtitle">One gateway for application traffic, metrics, dashboards, and correlated logs</text>

  <rect x="35" y="135" width="330" height="650" class="panel" stroke="#fb7b47" fill="#21170f"/>
  <text x="65" y="175" class="label">DEVELOPER MACHINE</text>
  <rect x="65" y="210" width="270" height="180" class="box" stroke="#fb7b47"/>
  <text x="88" y="245" class="label">Python load generator</text>
  <text x="88" y="280" class="body">Smoke or 100-user ramp</text>
  <text x="88" y="308" class="body">GET /products</text>
  <text x="88" y="336" class="body">POST /orders</text>
  <text x="88" y="364" class="body">GET /orders + invariant</text>
  <rect x="65" y="440" width="270" height="120" class="box" stroke="#fb7b47"/>
  <text x="88" y="477" class="label">minikube tunnel</text>
  <text x="88" y="510" class="body">127.0.0.1 → ingress</text>
  <text x="88" y="538" class="body">One host-to-cluster route</text>
  <rect x="65" y="610" width="270" height="135" class="box" stroke="#22c55e"/>
  <text x="88" y="647" class="label">Gateway + diagnostics</text>
  <text x="88" y="680" class="body">API + observability paths</text>
  <text x="88" y="708" class="body">kubectl logs · kubectl top</text>
  <text x="88" y="736" class="body">Artifacts + scoped dashboard</text>

  <rect x="410" y="135" width="1150" height="650" class="panel" stroke="#5b9cff" fill="#111a27"/>
  <text x="445" y="175" class="label">MINIKUBE CLUSTER</text>
  <rect x="455" y="215" width="290" height="135" class="box" stroke="#5b9cff"/>
  <text x="480" y="252" class="label">NGINX INGRESS</text>
  <text x="480" y="285" class="body">/api → store:8080</text>
  <text x="480" y="313" class="body">/grafana · /prometheus</text>
  <text x="480" y="341" class="body">Routes to ready Services</text>
  <rect x="805" y="195" width="470" height="210" class="box" stroke="#5b9cff"/>
  <text x="835" y="235" class="label">DEPLOYMENT / STORE · 1 REPLICA</text>
  <text x="835" y="270" class="body">Go REST API · /health · /products · /orders</text>
  <text x="835" y="300" class="body">/metrics · JSON logs · X-Request-ID</text>
  <text x="835" y="330" class="body">Startup · readiness · liveness probes</text>
  <text x="835" y="360" class="body">10m → 100m CPU · 16Mi → 32Mi RAM</text>
  <text x="835" y="390" class="body">Init: wait-for-postgres</text>
  <rect x="455" y="430" width="290" height="155" class="box" stroke="#a879ff"/>
  <text x="480" y="470" class="label">MONITORING NAMESPACE</text>
  <text x="480" y="505" class="body">Prometheus · ServiceMonitor</text>
  <text x="480" y="535" class="body">Grafana · dashboards</text>
  <text x="480" y="565" class="body">Alloy → Loki · 24h logs</text>
  <rect x="805" y="465" width="245" height="105" class="box" stroke="#22c55e"/>
  <text x="830" y="503" class="label">SERVICE / POSTGRES</text>
  <text x="830" y="538" class="body">ClusterIP · port 5432</text>
  <rect x="1110" y="450" width="385" height="150" class="box" stroke="#22c55e"/>
  <text x="1138" y="490" class="label">STATEFULSET / POSTGRES</text>
  <text x="1138" y="525" class="body">PostgreSQL 17 · constraints + transactions</text>
  <text x="1138" y="555" class="body">25m → 200m CPU · 64Mi → 128Mi RAM</text>
  <text x="1138" y="585" class="body">Readiness + liveness</text>
  <rect x="1110" y="650" width="385" height="85" class="box" stroke="#22c55e"/>
  <text x="1138" y="688" class="label">PVC / postgres-data</text>
  <text x="1138" y="718" class="body">1Gi · ReadWriteOnce</text>

  <path d="M 200 390 L 200 440" class="flow"/>
  <path d="M 335 500 C 390 500 390 280 455 280" class="flow"/>
  <path d="M 745 280 L 805 280" class="flow"/>
  <path d="M 1040 405 C 1040 445 970 440 970 465" class="flow"/>
  <path d="M 1050 520 L 1110 520" class="flow"/>
  <path d="M 1300 600 L 1300 650" class="flow"/>
  <path d="M 805 330 C 750 390 750 500 745 500" class="signal"/>
  <path d="M 455 520 C 390 520 390 675 335 675" class="signal"/>

  <rect x="35" y="850" width="300" height="90" class="box" stroke="#94a3b8"/>
  <text x="62" y="890" class="label">GitHub repository</text>
  <text x="62" y="922" class="body">Code · tests · manifests</text>
  <rect x="465" y="850" width="300" height="90" class="box" stroke="#a879ff"/>
  <text x="492" y="890" class="label">GitHub Actions</text>
  <text x="492" y="922" class="body">Test · vet · container build</text>
  <rect x="895" y="850" width="300" height="90" class="box" stroke="#a879ff"/>
  <text x="922" y="890" class="label">GHCR</text>
  <text x="922" y="922" class="body">chaosbox-store:latest</text>
  <path d="M 335 895 L 465 895" class="flow"/>
  <path d="M 765 895 L 895 895" class="flow"/>
  <path d="M 1195 895 C 1515 895 1530 350 1275 300" class="signal"/>
</svg>
