name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/store/go.mod
          cache-dependency-path: apps/store/go.sum

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code

      - name: Run unit tests with race detector
        run: make test-race

      - name: Run go vet
        run: make vet

      - name: Run PostgreSQL end-to-end tests
        run: make test-e2e

  build:
    name: Container build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build store image
        uses: docker/build-push-action@v6
        with:
          context: apps/store
          file: apps/store/Dockerfile
          push: false
          tags: chaosbox-store:${{ github.sha }}
