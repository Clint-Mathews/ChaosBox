name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/store/go.mod
          cache-dependency-path: apps/store/go.sum

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code

      - name: Run unit tests with race detector
        run: make test-race

      - name: Run go vet
        run: make vet

      - name: Run PostgreSQL end-to-end tests
        run: make test-e2e
